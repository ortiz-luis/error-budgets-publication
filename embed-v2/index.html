<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Error Budgets — Executive Embed</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#191919;--line:#e8e6e1;--muted:#76736d;--green:#e5f2e8;--greenT:#287342;--red:#fde5e2;--redT:#bd3028;--yellow:#fff2c9;--blue:#e7f1f8;--purple:#eee4f5}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:2px}.m{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.h{padding:13px 16px 10px;border-bottom:1px solid var(--line)}.ey{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}.sub{font-size:10px;color:var(--muted);margin-top:2px}.chip{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:9px;font-weight:800}.AT_RISK,.HIGH{background:var(--red);color:var(--redT)}.ON_TRACK,.DONE{background:var(--green);color:var(--greenT)}.MEDIUM{background:var(--yellow);color:#8a5b00}.IN_PROGRESS{background:var(--blue);color:#245b77}.PLANNED{background:var(--purple);color:#69448d}.bad{color:#d32f2f}.good{color:#278045}.overview .r{display:grid;grid-template-columns:minmax(150px,1.7fr) 1fr .9fr 1fr .8fr;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}.overview .r:first-child{border-top:0}.overview strong,.metric{font-size:11px}.small{font-size:9px;color:var(--muted);margin-top:2px}.op{display:flex;gap:8px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#e9867b}.dot.good{background:#74b58a}.rank{padding:8px 14px 12px}.rr{display:grid;grid-template-columns:24px minmax(120px,1.4fr) minmax(150px,2.6fr) 76px 68px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #f0efec}.rr:first-child{border-top:0}.track{height:10px;border-radius:999px;background:#f0efec;overflow:hidden}.fill{height:100%;background:#e47d74;border-radius:999px}.kpiwrap{padding:14px 16px}.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}.k{padding:12px 13px;border-radius:9px;min-height:72px}.k:nth-child(1){background:#e8f5eb}.k:nth-child(2){background:#f2f1ee}.k:nth-child(3){background:#fff3cd}.k:nth-child(4){background:#e7f1f8}.k span{font-size:10px;font-weight:700}.k strong{display:block;font-size:18px;margin-top:5px;line-height:1.08}.donutwrap{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:center;padding:16px}.donut{width:205px;height:205px;border-radius:50%;position:relative;margin:auto}.donut:after{content:"";position:absolute;inset:42px;background:#fff;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line)}.dc{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center}.dc span{font-size:10px;color:var(--muted)}.dc strong{font-size:20px}.leg{display:grid;gap:7px}.lr{display:grid;grid-template-columns:12px 1fr 70px 42px;gap:8px;align-items:center;font-size:10px}.sw{width:9px;height:9px;border-radius:50%}.lr strong,.lr em{text-align:right}.lr em{font-style:normal;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:10px}th,td{padding:9px 10px;border-top:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:9px}.hist{padding:10px 14px 14px}.chart{height:230px}.chart svg{width:100%;height:100%;overflow:visible}.grid{stroke:#efeeeb;stroke-width:1}.line{fill:none;stroke:#5f8fb5;stroke-width:3}.gapline{fill:none;stroke:#d8746c;stroke-width:3}.target{stroke:#8c8a84;stroke-width:1.5;stroke-dasharray:5 4}.tick{font-size:9px;fill:#77736d}.note{font-size:9px;color:var(--muted);margin-top:4px}.error{padding:14px;color:#9b2c22;background:#ffe2dd}.footer{font-size:9px;color:var(--muted);margin-top:9px}@media(max-width:700px){.overview .r{grid-template-columns:1.4fr .8fr .8fr}.hide{display:none}.rr{grid-template-columns:22px 1fr 1.4fr 62px}.impact{display:none}.kpis{grid-template-columns:1fr 1fr}.donutwrap{grid-template-columns:1fr}.donut{width:190px;height:190px}.lr{grid-template-columns:12px 1fr 62px 42px}.chart{height:210px}}
</style></head>
<body><main id="root"></main><script>
const P='../data/published_state.json',D='../data/published_detail_state.json';const q=new URLSearchParams(location.search),view=q.get('view')||'overview',opid=q.get('operation')||'2q',root=document.getElementById('root');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pct=(v,d=2)=>Number(v).toFixed(d)+'%';const pp=v=>(Number(v)>=0?'+':'')+Number(v).toFixed(2)+' pp';const head=(a,b='')=>`<div class="h"><div class="ey">${esc(a)}</div>${b?`<div class="sub">${esc(b)}</div>`:''}</div>`;const chip=x=>`<span class="chip ${esc(x)}">${esc(String(x).replaceAll('_',' '))}</span>`;const op=(d,id)=>{const x=d.operations.find(o=>o.id===id);if(!x)throw Error('Unknown operation '+id);return x};
function overview(p){root.innerHTML=`<section class="m">${head('Live operations overview','Git-backed fidelity, target, gap and status')}<div class="overview">${p.operations.map(o=>`<div class="r"><div class="op"><i class="dot ${o.status==='ON_TRACK'?'good':''}"></i><div><strong>${esc(o.short_name)}</strong><div class="small">${esc(o.title)}</div></div></div><div><div class="metric">${pct(o.fidelity_pct)} ± ${pct(o.fidelity_uncertainty_pp)}</div><div class="small">Fidelity</div></div><div class="hide"><div class="metric">${pct(o.target_fidelity_pct)}</div><div class="small">Target</div></div><div><div class="metric ${o.gap_to_target_pp>=0?'good':'bad'}">${pp(o.gap_to_target_pp)}</div><div class="small">Gap</div></div><div class="hide">${chip(o.status)}</div></div>`).join('')}</div></section>`}
function topgaps(p){const rows=p.operations.filter(o=>o.gap_to_target_pp<0).sort((a,b)=>a.gap_to_target_pp-b.gap_to_target_pp).slice(0,5),mx=Math.max(...rows.map(o=>Math.abs(o.gap_to_target_pp)),1);root.innerHTML=`<section class="m">${head('Top gaps','Largest deficits to target')}<div class="rank">${rows.map((o,i)=>`<div class="rr"><div class="small">${i+1}</div><strong>${esc(o.short_name)}</strong><div class="track"><div class="fill" style="width:${100*Math.abs(o.gap_to_target_pp)/mx}%"></div></div><strong class="bad">${pp(o.gap_to_target_pp)}</strong><span class="chip HIGH impact">${Math.abs(o.gap_to_target_pp)>=5?'HIGH':'LOW'}</span></div>`).join('')}</div></section>`}
function kpi(p){const o=op(p,opid);root.innerHTML=`<section class="m kpiwrap"><div class="toprow"><div><div class="ey">Current KPI</div><div class="sub">${esc(o.short_name)} · ${esc(o.title)}</div></div>${chip(o.status)}</div><div class="kpis"><div class="k"><span>Fidelity</span><strong>${pct(o.fidelity_pct)} ± ${pct(o.fidelity_uncertainty_pp)}</strong></div><div class="k"><span>Target</span><strong>${pct(o.target_fidelity_pct)}</strong></div><div class="k"><span>Gap</span><strong class="${o.gap_to_target_pp>=0?'good':'bad'}">${pp(o.gap_to_target_pp)}</strong></div><div class="k"><span>Data date</span><strong>${esc(o.live_at)}</strong></div></div><div class="footer">Live from sanitized publication state</div></section>`}
function donut(d){const o=op(d,opid),c=[...o.contributors].sort((a,b)=>b.impact_error_pp-a.impact_error_pp),cs=['#4f83cc','#ef8b39','#5fa66e','#8c64ad','#f1b43c','#9a9a9a','#6ca0b6'];let s=0;const seg=c.map((x,i)=>{let e=s+x.share_pct,r=`${cs[i%cs.length]} ${s}% ${e}%`;s=e;return r});root.innerHTML=`<section class="m">${head(o.short_name+' · Error budget decomposition','Infidelity contribution · share and pp')}<div class="donutwrap"><div class="donut" style="background:conic-gradient(${seg.join(',')})"><div class="dc"><span>Total infidelity</span><strong>${Number(o.total_infidelity_pp).toFixed(2)} pp</strong></div></div><div class="leg">${c.map((x,i)=>`<div class="lr"><i class="sw" style="background:${cs[i%cs.length]}"></i><span>${esc(x.name)}</span><strong>${Number(x.impact_error_pp).toFixed(3)} pp</strong><em>${pct(x.share_pct,0)}</em></div>`).join('')}</div></div></section>`}
function actions(d){const o=op(d,opid),a=d.actions.filter(x=>x.operation_id===o.id);root.innerHTML=`<section class="m">${head(o.short_name+' · Main gaps & actions','Current gap '+pp(o.gap_to_target_pp))}<table><thead><tr><th>Action</th><th>Priority</th><th>Owner</th><th>State</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.action)}</td><td>${chip(x.priority)}</td><td>${esc(x.owner)}</td><td>${chip(x.state)}</td></tr>`).join('')}</tbody></table></section>`}
function history(d,mode){const o=op(d,opid),h=o.history||[];if(!h.length){root.innerHTML='<div class="error">No validated history.</div>';return}const W=760,H=210,L=48,R=18,T=18,B=34,vals=h.map(x=>mode==='gap'?x.fidelity_pct-o.target_fidelity_pct:x.fidelity_pct);let mn=Math.min(...vals,mode==='gap'?0:o.target_fidelity_pct),mx=Math.max(...vals,mode==='gap'?0:o.target_fidelity_pct);if(mode!=='gap'){const p=Math.max(.2,(mx-mn)*.15);mn-=p;mx+=p}if(mx===mn){mx++;mn--}const X=i=>L+(W-L-R)*(h.length===1?.5:i/(h.length-1)),Y=v=>T+(H-T-B)*(mx-v)/(mx-mn),pts=vals.map((v,i)=>`${X(i)},${Y(v)}`).join(' '),grid=Array.from({length:5},(_,i)=>{const v=mx-(mx-mn)*i/4;return `<line class="grid" x1="${L}" y1="${Y(v)}" x2="${W-R}" y2="${Y(v)}"/><text class="tick" x="4" y="${Y(v)+3}">${mode==='gap'?v.toFixed(1)+' pp':v.toFixed(1)+'%'}</text>`}).join(''),ref=mode==='gap'?0:o.target_fidelity_pct;root.innerHTML=`<section class="m">${head(o.short_name+' · '+(mode==='gap'?'Gap history':'Fidelity history'),'Validated Git snapshots · '+(mode==='gap'?'gap to target':'fidelity vs target'))}<div class="hist"><div class="chart"><svg viewBox="0 0 ${W} ${H}">${grid}<line class="target" x1="${L}" y1="${Y(ref)}" x2="${W-R}" y2="${Y(ref)}"/><polyline class="${mode==='gap'?'gapline':'line'}" points="${pts}"/>${vals.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${mode==='gap'?'#d8746c':'#5f8fb5'}" stroke="#fff" stroke-width="2"/>`).join('')}</svg></div><div class="note">${h.length} validated snapshot(s) · latest ${esc(h[h.length-1].date)}</div></div></section>`}
Promise.all([fetch(P).then(r=>r.json()),fetch(D).then(r=>r.json())]).then(([p,d])=>{if(view==='overview')overview(p);else if(view==='top-gaps')topgaps(p);else if(view==='kpi')kpi(p);else if(view==='decomposition-donut')donut(d);else if(view==='gap-action')actions(d);else if(view==='fidelity-history')history(d,'fidelity');else if(view==='gap-history')history(d,'gap');else throw Error('Unknown view '+view)}).catch(e=>root.innerHTML='<div class="error">'+esc(e.message)+'</div>');
</script></body></html>
